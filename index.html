<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Monitores Dell</title>

<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#0f172a;
color:white
}
.app{
max-width:520px;
margin:auto;
padding:16px
}
.card{
background:#1e293b;
padding:16px;
border-radius:18px;
margin-bottom:15px
}
h1{font-size:24px}
video,canvas{
width:100%;
border-radius:14px;
background:#000
}
button{
width:100%;
padding:15px;
border:0;
border-radius:12px;
background:#0076ce;
color:white;
font-size:16px;
margin-top:10px
}
.secondary{background:#374151}
.field{
background:#111827;
padding:10px;
border-radius:10px;
margin:8px 0
}
.ok{color:#22c55e}
.warn{color:#facc15}
</style>
</head>

<body>
<div class="app">

<h1>INVENTARIO MONITORES DELL</h1>

<div class="card">
<video id="video" autoplay playsinline></video>
<button onclick="openCamera()">Escanear etiqueta Dell</button>
<button onclick="analyze()">Capturar y analizar</button>
<canvas id="canvas" hidden></canvas>
</div>

<div class="card">
<h2>Resultado</h2>
<div id="result">Esperando captura...</div>
</div>

<div class="card">
<h2>Inventario</h2>
<div id="list"></div>
<button class="secondary" onclick="exportCSV()">Exportar CSV</button>
</div>

</div>

<script>

let video=document.getElementById("video");
let canvas=document.getElementById("canvas");
let inventory=JSON.parse(localStorage.getItem("dell_inventory")||"[]");

async function openCamera(){
let stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
});
video.srcObject=stream;
}

async function analyze(){

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

let ctx=canvas.getContext("2d");
ctx.drawImage(video,0,0);

let img=canvas.toDataURL();

document.getElementById("result").innerHTML="Procesando etiqueta Dell...";

let processed=await improveImage(img);

let text=await runOCR(processed);

let data=extractDell(text);

showResult(data);

}


async function improveImage(image){

// Preparado para OpenCV:
// - corrección perspectiva
// - contraste
// - nitidez
// - reducción ruido

return image;

}


async function runOCR(image){

let result=await Tesseract.recognize(
image,
'eng'
);

return result.data.text.toUpperCase();

}


function correctOCR(value){

return value
.replace(/O/g,"0")
.replace(/[IL]/g,"1")
.replace(/S/g,"5")
.replace(/B/g,"8");

}


function extractDell(text){

let clean=correctOCR(text);

let modelo=(clean.match(/[PUS]\d{4}[A-Z]{1,3}/)||[])[0]||"No detectado";

let service=(clean.match(/[A-Z0-9]{7}/)||[])[0]||"No detectado";

let mac=(clean.match(/[A-F0-9]{12}/)||[])[0]||"No detectado";

let express=(clean.match(/\d{10,12}/)||[])[0]||"No detectado";

let serial=(clean.match(/[A-Z]{2}-[A-Z0-9-]{15,}/)||[])[0]||"No detectado";

let date=(clean.match(/\d{2,4}[-\/]\d{2,4}|[A-Z]+\s*,?\s*\d{4}/)||[])[0]||"No detectado";


return {
marca:"DELL",
modelo:modelo,
service_tag:service,
serial:serial,
express:express,
fecha:date,
mac:mac,
confianza:"Calculada por reglas Dell"
};

}


function showResult(d){

document.getElementById("result").innerHTML=`

<div class="field">Marca: ${d.marca}</div>
<div class="field">Modelo: ${d.modelo}</div>
<div class="field">Service Tag: ${d.service_tag}</div>
<div class="field">Serial: ${d.serial}</div>
<div class="field">Express Code: ${d.express}</div>
<div class="field">Fabricación: ${d.fecha}</div>
<div class="field">MAC: ${d.mac}</div>

<p class="ok">Validación Dell aplicada</p>

<button onclick='save(${JSON.stringify(d)})'>
Confirmar registro
</button>

`;

}


function save(data){

inventory.push({
...data,
fecha_captura:new Date().toLocaleString()
});

localStorage.setItem(
"dell_inventory",
JSON.stringify(inventory)
);

load();

}


function load(){

let html="";

inventory.forEach((x,i)=>{

html+=`
<div class="field">
${i+1}. ${x.modelo}<br>
SVC: ${x.service_tag}<br>
Serial: ${x.serial}
</div>
`;

});

document.getElementById("list").innerHTML=html;

}


function exportCSV(){

let csv="Marca,Modelo,Service Tag,Serial,Express,Fecha,MAC\n";

inventory.forEach(x=>{
csv+=`${x.marca},${x.modelo},${x.service_tag},${x.serial},${x.express},${x.fecha},${x.mac}\n`;
});

let blob=new Blob([csv]);
let a=document.createElement("a");

a.href=URL.createObjectURL(blob);
a.download="Inventario_Monitores_Dell.csv";
a.click();

}

load();

</script>
</body>
</html>
