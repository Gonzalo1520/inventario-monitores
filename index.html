<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Monitores TI V8</title>
<style>
:root{--wine:#7a0019;--bg:#f4f6f8}
body{margin:0;background:var(--bg);font-family:Segoe UI,Arial;color:#222}
header{background:linear-gradient(135deg,#7a0019,#4d0010);color:white;padding:20px}
.container{max-width:1000px;margin:auto;padding:15px}
.card{background:white;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 5px 15px #0002}
h2{font-size:18px}
button{width:100%;padding:14px;background:#7a0019;color:white;border:0;border-radius:10px;font-weight:bold;margin-top:10px}
video{width:100%;border-radius:12px;background:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #ccc}
.auto{background:#eef1f4}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px;border-bottom:1px solid #ddd}
.status{padding:10px;background:#eee;border-radius:8px}
.ok{background:#e5f7ed;color:#087443}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
<script src="https://unpkg.com/@zxing/library"></script>
</head>
<body>

<header>
<h1>Inventario de Monitores TI</h1>
<p>Escaneo y registro de activos</p>
</header>

<div class="container">

<div class="card">
<h2>1. Escanear etiqueta</h2>

<video id="video"></video>
<button onclick="startCamera()">Abrir cámara</button>
<button onclick="procesar()">Capturar y analizar</button>

<div id="msg" class="status">Esperando escaneo...</div>
<textarea id="debug" placeholder="Datos detectados"></textarea>
</div>


<div class="card">
<h2>2. Datos del monitor</h2>

<div class="grid">
<input id="marca" class="auto" placeholder="Marca">
<input id="modelo" class="auto" placeholder="Modelo">
<input id="serial" class="auto" placeholder="Serial">
<input id="tag" class="auto" placeholder="Service Tag">
<input id="mac" class="auto" placeholder="MAC">
<input id="fabricacion" class="auto" placeholder="Fabricación">
<input id="express" class="auto" placeholder="Express Code">
<input id="tamano" class="auto" placeholder="Tamaño">
</div>
</div>


<div class="card">
<h2>3. Asignación</h2>
<div class="grid">
<input id="activo" placeholder="Código activo">
<select id="estado">
<option>Operativo</option>
<option>Observado</option>
<option>Reparación</option>
<option>Almacén</option>
</select>
<input id="usuario" placeholder="Usuario">
<input id="area" placeholder="Área">
<input id="sede" placeholder="Sede">
<input id="ubicacion" placeholder="Ubicación">
</div>

<textarea id="obs" placeholder="Observaciones"></textarea>

<button onclick="guardar()">Guardar monitor</button>
</div>


<div class="card">
<h2>4. Resumen inventario</h2>
<p>Total registrados: <b id="total">0</b></p>

<table id="tabla">
<tr>
<th>Marca</th>
<th>Modelo</th>
<th>Serial</th>
<th>Usuario</th>
<th>Ubicación</th>
</tr>
</table>

<button onclick="exportar()">Exportar CSV</button>

</div>

</div>


<script>

let inventario=[];
let codeReader=new ZXing.BrowserMultiFormatReader();

function set(id,v){
document.getElementById(id).value=v||"";
}


async function startCamera(){

let devices=await ZXing.BrowserCodeReader.listVideoInputDevices();

let cam=devices.find(x=>/back|rear|environment/i.test(x.label))||devices[0];

codeReader.decodeFromVideoDevice(cam.deviceId,"video",
(result,error)=>{

if(result){
analizarCodigo(result.text);
}

});

document.getElementById("msg").innerHTML="Cámara activa";

}


function analizarCodigo(texto){

let t=texto.toUpperCase();

set("marca","DELL");

let x;

x=t.match(/[PUS]\d{4}[A-Z]{1,4}/);
if(x)set("modelo",x[0]);

x=t.match(/TH-[A-Z0-9-]{10,50}/);
if(x)set("serial",x[0]);

x=t.match(/[A-Z0-9]{7}/);
if(x)set("tag",x[0]);

document.getElementById("debug").value=texto;

}


function procesar(){
document.getElementById("msg").innerHTML="Buscando códigos Data Matrix...";
}


function guardar(){

let item={
fecha:new Date().toLocaleString(),
marca:marca.value,
modelo:modelo.value,
serial:serial.value,
tag:tag.value,
mac:mac.value,
fabricacion:fabricacion.value,
express:express.value,
tamano:tamano.value,
activo:activo.value,
estado:estado.value,
usuario:usuario.value,
area:area.value,
sede:sede.value,
ubicacion:ubicacion.value,
obs:obs.value
};

if(!item.serial&&!item.tag&&!item.activo){
alert("Falta identificador");
return;
}

inventario.push(item);
render();

alert("Monitor registrado");

}


function render(){

total.innerHTML=inventario.length;

tabla.innerHTML="<tr><th>Marca</th><th>Modelo</th><th>Serial</th><th>Usuario</th><th>Ubicación</th></tr>";

inventario.forEach(x=>{

tabla.innerHTML+=`
<tr>
<td>${x.marca}</td>
<td>${x.modelo}</td>
<td>${x.serial}</td>
<td>${x.usuario}</td>
<td>${x.ubicacion}</td>
</tr>`;

});

}


function exportar(){

let csv="Fecha;Marca;Modelo;Serial;ServiceTag;MAC;Fabricacion;Usuario;Area;Sede;Ubicacion;Estado;Observaciones\n";

inventario.forEach(x=>{

csv+=`${x.fecha};${x.marca};${x.modelo};${x.serial};${x.tag};${x.mac};${x.fabricacion};${x.usuario};${x.area};${x.sede};${x.ubicacion};${x.estado};${x.obs}\n`;

});

let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([csv]));
a.download="Inventario_Monitores.csv";
a.click();

}

</script>

</body>
</html>
