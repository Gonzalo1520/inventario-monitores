<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario Monitores V3</title>
<style>
body{font-family:Arial;background:#f4f5f7;margin:0;color:#222}
header{background:#7a0019;color:white;padding:18px}
main{max-width:900px;margin:auto;padding:15px}
.card{background:white;padding:15px;border-radius:12px;margin-bottom:15px}
input,textarea,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #ccc}
button{background:#7a0019;color:white;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{padding:10px;background:#eee;border-radius:8px}
.ok{background:#dff5e6}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<header>
<h2>Inventario Monitores V3</h2>
<p>Dell / Samsung OCR inteligente</p>
</header>

<main>
<div class="card">
<h3>Foto de etiqueta</h3>
<input id="foto" type="file" accept="image/*" capture="environment">
<button onclick="leer()">Analizar etiqueta</button>
<div id="estado" class="status">Esperando imagen</div>
<textarea id="ocr" placeholder="Texto reconocido"></textarea>
</div>

<div class="card">
<h3>Datos detectados</h3>
<div class="grid">
<input id="marca" placeholder="Marca">
<input id="modelo" placeholder="Modelo">
<input id="tag" placeholder="Service Tag">
<input id="serial" placeholder="Serial">
<input id="mac" placeholder="MAC">
<input id="fecha" placeholder="Fecha fabricación">
<input id="express" placeholder="Express Code">
<input id="activo" placeholder="Código activo">
<input id="usuario" placeholder="Usuario">
<input id="ubicacion" placeholder="Ubicación">
</div>
<button onclick="guardar()">Guardar monitor</button>
</div>

<div class="card">
<button onclick="csv()">Exportar CSV</button>
<table id="tabla" border="1" width="100%"></table>
</div>
</main>

<script>
let inventario=[];

function normalizar(t){
return t.toUpperCase()
.replace(/D3LL/g,"DELL")
.replace(/SVCTAG/g,"SVC TAG")
.replace(/SERVICETAG/g,"SVC TAG");
}

function extraer(t){
t=normalizar(t);

if(t.includes("DELL")) marca.value="DELL";
if(t.includes("SAMSUNG")) marca.value="SAMSUNG";

let x;
x=t.match(/\b(P\d{4}[A-Z]{1,4})\b/);
if(x) modelo.value=x[1];

x=t.match(/SVC\s*TAG[:\s\n]*([A-Z0-9]{6,8})/);
if(x) tag.value=x[1];

x=t.match(/S\/N[:\s\n]*([A-Z0-9\-]{10,50})/);
if(x) serial.value=x[1];

x=t.match(/MAC\s*ADDRESS[:\s]*([A-F0-9]{12})/);
if(x) mac.value=x[1];

x=t.match(/DATE\s*OF\s*MFG.*?([A-Z]+\s+\d{4})/);
if(x) fecha.value=x[1];

x=t.match(/EXPRESS\s*SERVICE\s*CODE[:\s\n]*([0-9\s]{8,20})/);
if(x) express.value=x[1];

estado.innerHTML="Datos extraídos correctamente. Revisar antes de guardar.";
estado.className="status ok";
}

async function leer(){
let f=foto.files[0];
if(!f)return alert("Seleccione una foto");

estado.innerHTML="Procesando OCR...";
let r=await Tesseract.recognize(f,"eng");
ocr.value=r.data.text;
extraer(r.data.text);
}

function guardar(){
let obj={
marca:marca.value,
modelo:modelo.value,
tag:tag.value,
serial:serial.value,
mac:mac.value,
fecha:fecha.value,
express:express.value,
activo:activo.value,
usuario:usuario.value,
ubicacion:ubicacion.value
};

inventario.push(obj);
mostrar();
}

function mostrar(){
tabla.innerHTML="<tr><th>Marca</th><th>Modelo</th><th>Serial</th><th>Tag</th></tr>";
inventario.forEach(x=>{
tabla.innerHTML+=`<tr><td>${x.marca}</td><td>${x.modelo}</td><td>${x.serial}</td><td>${x.tag}</td></tr>`;
});
}

function csv(){
let txt="Marca;Modelo;Serial;Tag\n";
inventario.forEach(x=>txt+=`${x.marca};${x.modelo};${x.serial};${x.tag}\n`);
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([txt]));
a.download="inventario_monitores.csv";
a.click();
}
</script>
</body>
</html>
