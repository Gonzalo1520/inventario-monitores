<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dell Smart Inventory Scanner V3</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{margin:0;background:#0f172a;color:white;font-family:Arial}
.app{max-width:520px;margin:auto;padding:15px}
.card{background:#1e293b;border-radius:18px;padding:18px;margin-bottom:15px}
video,canvas{width:100%;border-radius:12px;background:#000}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#0076ce;color:white;font-size:17px;margin-top:10px}
.field{background:#111827;padding:10px;border-radius:10px;margin:8px 0}
.ok{color:#4ade80}
.warn{color:#facc15}
</style>
</head>

<body>
<div class="app">

<h2>Inventario Monitores Dell</h2>

<div class="card">
<video id="video" autoplay playsinline></video>
<button onclick="camera()">Abrir cámara</button>
<button onclick="scan()">Escanear etiqueta Dell</button>
<canvas id="canvas" hidden></canvas>
</div>

<div class="card">
<h3>Resultado validado</h3>
<div id="result">Esperando captura...</div>
</div>

</div>

<script>

let video=document.getElementById("video");
let canvas=document.getElementById("canvas");

async function camera(){
let s=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
});
video.srcObject=s;
}


async function scan(){

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

let ctx=canvas.getContext("2d");
ctx.drawImage(video,0,0);

let image=canvas.toDataURL();

document.getElementById("result").innerHTML="Detectando zonas Dell...";

let zones=createZones();

let result={};

for(let z in zones){

let crop=cropZone(canvas,zones[z]);

let text=await OCR(crop);

result[z]=text;
}

let dell=parseDell(result);

show(dell);

}


function createZones(){

// Coordenadas relativas para etiquetas Dell P Series
return {

modelo:{x:.72,y:.02,w:.25,h:.18},

fecha:{x:.10,y:.35,w:.65,h:.18},

mac:{x:.10,y:.40,w:.55,h:.15},

service:{x:.20,y:.62,w:.30,h:.20},

serial:{x:.62,y:.62,w:.35,h:.25},

express:{x:.20,y:.80,w:.35,h:.15}

};

}


function cropZone(canvas,z){

let c=document.createElement("canvas");

c.width=canvas.width*z.w;
c.height=canvas.height*z.h;

c.getContext("2d").drawImage(
canvas,
canvas.width*z.x,
canvas.height*z.y,
canvas.width*z.w,
canvas.height*z.h,
0,
0,
c.width,
c.height
);

return c.toDataURL();

}


async function OCR(img){

let r=await Tesseract.recognize(img,"eng");
return r.data.text.toUpperCase();

}


function clean(v){

return v
.replace(/\s/g,"")
.replace(/O/g,"0")
.replace(/[IL]/g,"1")
.replace(/S/g,"5")
.replace(/B/g,"8");

}


function parseDell(z){

let modelo=(clean(z.modelo).match(/[PUS]\d{4}[A-Z]{1,3}/)||["No detectado"])[0];

let service=clean(z.service);
if(service==modelo) service="No detectado";
service=(service.match(/[A-Z0-9]{7}/)||["No detectado"])[0];


let serial=z.serial
.replace(/\n/g,"")
.match(/[A-Z]{2}-[A-Z0-9-]{15,}/);

let express=clean(z.express)
.match(/\d{10,12}/);


let mac=clean(z.mac)
.match(/[A-F0-9]{12}/);


let fecha=z.fecha.match(/\d{4}/);


return {
modelo,
service,
serial:serial?serial[0]:"No detectado",
express:express?express[0]:"No detectado",
mac:mac?mac[0]:"No detectado",
fecha:fecha?fecha[0]:"No detectado"
};

}


function show(d){

document.getElementById("result").innerHTML=`

<div class="field">Marca: DELL</div>
<div class="field">Modelo: ${d.modelo}</div>
<div class="field">Service Tag: ${d.service}</div>
<div class="field">Serial: ${d.serial}</div>
<div class="field">Express Code: ${d.express}</div>
<div class="field">Fabricación: ${d.fecha}</div>
<div class="field">MAC: ${d.mac}</div>

<p class="ok">Validación Dell V3 aplicada</p>

`;

}

</script>
</body>
</html>
