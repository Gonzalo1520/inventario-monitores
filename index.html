<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Monitores V6</title>
<style>
:root{--wine:#7a0019;--bg:#f4f6f8;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Segoe UI,Arial;color:#202733}
header{background:linear-gradient(135deg,#7a0019,#500012);color:white;padding:20px}
.container{max-width:950px;margin:auto;padding:15px}
.card{background:white;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 5px 15px #0001}
h2{font-size:18px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--wine);color:white;font-weight:bold;margin-top:10px}
video{width:100%;border-radius:12px;background:#111}
.cameraBox{position:relative}
.guide{position:absolute;top:25%;left:15%;width:70%;height:45%;border:3px solid #fff;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:12px;font-weight:bold;color:#667085}
input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin-top:5px}
.auto{background:#f1f3f5}
.status{padding:10px;background:#eee;border-radius:8px;margin-top:10px}
.ok{background:#e7f7ed;color:#067647}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<header>
<h1>Inventario de Monitores</h1>
<p>Escaneo Dell / Samsung con cámara</p>
</header>

<div class="container">

<div class="card">
<h2>1. Escaneo de etiqueta</h2>

<div class="cameraBox">
<video id="video" autoplay playsinline></video>
<div class="guide"></div>
</div>

<button onclick="abrirCamara()">Abrir cámara</button>
<button onclick="capturar()">Capturar etiqueta</button>

<canvas id="canvas" style="display:none"></canvas>
<img id="foto" style="width:100%;margin-top:10px;border-radius:10px">

<div id="estado" class="status">Cámara apagada</div>
<textarea id="ocr" placeholder="Texto OCR"></textarea>
</div>


<div class="card">
<h2>2. Datos detectados</h2>
<div class="grid">
<div><label>Marca</label><input id="marca" class="auto" readonly></div>
<div><label>Modelo</label><input id="modelo" class="auto" readonly></div>
<div><label>Service Tag</label><input id="tag" class="auto" readonly></div>
<div><label>Serial</label><input id="serial" class="auto" readonly></div>
<div><label>MAC</label><input id="mac" class="auto" readonly></div>
<div><label>Fabricación</label><input id="fabricacion" class="auto" readonly></div>
<div><label>Express Code</label><input id="express" class="auto" readonly></div>
<div><label>Tamaño</label><input id="tamano" class="auto" readonly></div>
</div>
</div>


<div class="card">
<h2>3. Asignación</h2>
<div class="grid">
<div><label>Código activo</label><input id="activo"></div>
<div><label>Estado</label><select id="estadoActivo"><option>Operativo</option><option>Observado</option><option>Reparación</option><option>Almacén</option><option>Baja</option></select></div>
<div><label>Usuario</label><input id="usuario"></div>
<div><label>Área</label><input id="area"></div>
<div><label>Sede</label><input id="sede"></div>
<div><label>Ubicación</label><input id="ubicacion"></div>
</div>
<textarea id="obs" placeholder="Observaciones"></textarea>
<button onclick="guardar()">Guardar activo</button>
</div>

</div>

<script>
let stream;

const $=x=>document.getElementById(x);

function set(id,v){$(id).value=v||""}

async function abrirCamara(){
try{
stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:{ideal:"environment"}},
audio:false
});
$("video").srcObject=stream;
$("estado").innerHTML="Cámara activa. Alinee la etiqueta dentro del cuadro.";
}catch(e){
$("estado").innerHTML="No se pudo abrir cámara. Verifique permisos.";
}
}

async function capturar(){
let c=$("canvas"),v=$("video");
c.width=v.videoWidth;c.height=v.videoHeight;
c.getContext("2d").drawImage(v,0,0);
c.toBlob(async b=>{
let file=new File([b],"etiqueta.jpg",{type:"image/jpeg"});
$("foto").src=URL.createObjectURL(file);
$("estado").innerHTML="Procesando imagen...";
let r=await Tesseract.recognize(file,"eng");
$("ocr").value=r.data.text;
extraer(r.data.text);
},"image/jpeg");
}

function extraer(t){
let x;
let u=t.toUpperCase()
.replace(/D3LL/g,"DELL")
.replace(/SVCTAG/g,"SVC TAG");

if(u.includes("DELL"))set("marca","DELL");
if(u.includes("SAMSUNG"))set("marca","SAMSUNG");

x=u.match(/\b[PUS]\d{4}[A-Z]{1,4}\b/);
if(x){set("modelo",x[0]);set("tamano",x[0].substring(1,3)+'"')}

x=u.match(/SVC\s*TAG[\s:\n]*([A-Z0-9]{7})/);
if(x)set("tag",x[1]);

x=u.match(/(TH-[A-Z0-9-]{10,45})/);
if(x)set("serial",x[1]);

x=u.match(/[A-F0-9]{12}/);
if(x && u.includes("MAC"))set("mac",x[0]);

x=u.match(/[A-Z]+\s+\d{4}/);
if(x && u.includes("DATE"))set("fabricacion",x[0]);

$("estado").innerHTML="Extracción finalizada. Revise los datos detectados.";
$("estado").className="status ok";
}

function guardar(){
if(!$("serial").value&&!$("tag").value&&!$("activo").value){
alert("Falta identificador del activo");
return;
}
alert("Activo guardado");
}
</script>
</body>
</html>
