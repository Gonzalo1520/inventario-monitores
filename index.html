<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Monitores TI V11</title>
<style>
:root{--wine:#7a0019;--bg:#f4f6f8}
body{margin:0;background:var(--bg);font-family:Segoe UI,Arial;color:#202733}
header{background:linear-gradient(135deg,#7a0019,#4b0010);color:white;padding:22px}
.container{max-width:1000px;margin:auto;padding:15px}
.card{background:white;border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 5px 18px #0002}
button{width:100%;padding:14px;background:#7a0019;color:white;border:0;border-radius:10px;font-weight:bold;margin-top:10px}
video{width:100%;border-radius:12px;background:#000}
canvas{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #ccc}
.auto{background:#eef1f4}
.status{padding:12px;background:#eee;border-radius:10px}
.ok{background:#e6f7ed;color:#087443}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #ddd}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<h1>Inventario de Monitores TI</h1>
<p>Escaneo y control de activos</p>
</header>

<div class="container">

<div class="card">
<h2>1. Escanear etiqueta</h2>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<button onclick="abrirCamara()">Abrir cámara</button>
<button onclick="capturar()">Capturar y analizar</button>

<div id="estado" class="status">Cámara detenida</div>
<textarea id="texto" placeholder="Resultado detección"></textarea>
</div>

<div class="card">
<h2>2. Datos técnicos detectados</h2>
<div class="grid">
<input id="marca" class="auto" placeholder="Marca">
<input id="modelo" class="auto" placeholder="Modelo">
<input id="serial" class="auto" placeholder="Serial">
<input id="tag" class="auto" placeholder="Service Tag">
<input id="mac" class="auto" placeholder="MAC">
<input id="fabricacion" class="auto" placeholder="Fabricación">
<input id="express" class="auto" placeholder="Express Code">
<input id="tamano" class="auto" placeholder="Tamaño">
</div>
</div>

<div class="card">
<h2>3. Datos de inventario</h2>
<div class="grid">
<input id="activo" placeholder="Código activo">
<select id="estadoActivo">
<option>Operativo</option>
<option>Observado</option>
<option>Reparación</option>
<option>Almacén</option>
<option>Baja</option>
</select>
<input id="usuario" placeholder="Usuario asignado">
<input id="area" placeholder="Área">
<input id="sede" placeholder="Sede">
<input id="ubicacion" placeholder="Ubicación">
</div>
<textarea id="obs" placeholder="Observaciones"></textarea>
<button onclick="guardar()">Guardar monitor</button>
</div>

<div class="card">
<h2>4. Resumen inventario</h2>
<p>Total equipos: <b id="total">0</b></p>
<table id="tabla">
<tr><th>Marca</th><th>Modelo</th><th>Serial</th><th>Usuario</th><th>Ubicación</th></tr>
</table>
<button onclick="exportar()">Exportar CSV</button>
</div>

</div>

<script>
let stream=null;
let inventario=[];

const $=id=>document.getElementById(id);

function set(id,v){$(id).value=v||""}

async function abrirCamara(){
try{
stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:{ideal:"environment"}},
audio:false
});
$("video").srcObject=stream;
$("estado").innerHTML="Cámara activa";
}catch(e){
$("estado").innerHTML="Error cámara: "+e.message;
}
}

function capturar(){
if(!stream){$("estado").innerHTML="Abra la cámara primero";return;}

let video=$("video");
let canvas=$("canvas");
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
canvas.getContext("2d").drawImage(video,0,0);

$("estado").innerHTML="Imagen capturada. Lista para análisis.";

analizarPatrones();
}

function analizarPatrones(){
/* Base preparada para Data Matrix/OCR */
let texto=$("texto").value.toUpperCase();

if(texto.includes("DELL"))set("marca","DELL");

let x=texto.match(/[PUS]\d{4}[A-Z]{1,4}/);
if(x){set("modelo",x[0]);set("tamano",x[0].substring(1,3)+'"')}

x=texto.match(/TH-[A-Z0-9-]{10,50}/);
if(x)set("serial",x[0]);

x=texto.match(/[A-Z0-9]{7}/);
if(x)set("tag",x[0]);

}

function guardar(){
let item={
fecha:new Date().toLocaleString(),
marca:marca.value,
modelo:modelo.value,
serial:serial.value,
tag:tag.value,
mac:mac.value,
fabricacion:fabricacion.value,
express:express.value,
activo:activo.value,
estado:estadoActivo.value,
usuario:usuario.value,
area:area.value,
sede:sede.value,
ubicacion:ubicacion.value,
obs:obs.value
};

if(!item.serial&&!item.tag&&!item.activo){
alert("Falta identificador del activo");
return;
}

inventario.push(item);
render();
alert("Monitor guardado");
}

function render(){
total.innerHTML=inventario.length;
tabla.innerHTML="<tr><th>Marca</th><th>Modelo</th><th>Serial</th><th>Usuario</th><th>Ubicación</th></tr>";
inventario.forEach(x=>{
tabla.innerHTML+=`<tr><td>${x.marca}</td><td>${x.modelo}</td><td>${x.serial}</td><td>${x.usuario}</td><td>${x.ubicacion}</td></tr>`;
});
}

function exportar(){
let csv="Fecha;Marca;Modelo;Serial;Service Tag;Usuario;Area;Sede;Ubicacion;Estado;Observaciones\n";
inventario.forEach(x=>{
csv+=`${x.fecha};${x.marca};${x.modelo};${x.serial};${x.tag};${x.usuario};${x.area};${x.sede};${x.ubicacion};${x.estado};${x.obs}\n`;
});
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([csv]));
a.download="Inventario_Monitores.csv";
a.click();
}
</script>

</body>
</html>
