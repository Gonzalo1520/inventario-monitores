<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dell Scanner V5</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:15px}
.card{background:#1e293b;padding:18px;border-radius:16px;margin-bottom:15px}
video{width:100%;border-radius:12px;background:#000}
button{width:100%;padding:15px;margin-top:10px;background:#0076ce;color:white;border:0;border-radius:12px;font-size:17px}
input{width:100%;padding:12px;margin:5px 0;background:#111827;color:white;border:0;border-radius:8px}
label{color:#94a3b8;font-size:13px}
</style>
</head>
<body>

<h2>Inventario Monitores Dell</h2>

<div class="card">
<video id="video" autoplay playsinline></video>
<button onclick="camera()">Abrir cámara</button>
<button onclick="scan()">Capturar y analizar</button>
<canvas id="canvas" hidden></canvas>
</div>

<div class="card">
<h3>Datos encontrados</h3>

<label>Marca</label><input id="marca">
<label>Modelo</label><input id="modelo">
<label>Service Tag</label><input id="svc">
<label>Serial Number</label><input id="serial">
<label>Express Code</label><input id="express">
<label>Date Of Mfg</label><input id="fecha">
<label>MAC Address</label><input id="mac">

<button onclick="guardar()">Guardar</button>

<p id="estado"></p>
</div>

<script>

let video=document.getElementById("video");
let canvas=document.getElementById("canvas");

async function camera(){
let s=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
});
video.srcObject=s;
}


async function scan(){

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

canvas.getContext("2d").drawImage(video,0,0);

estado.innerHTML="Procesando OCR real...";

let r=await Tesseract.recognize(canvas,"eng");

let text=filterDell(r.data.text);

parse(text);

estado.innerHTML="OCR completado. Revisar campos y confirmar.";

}


function filterDell(t){

return t
.replace(/[\u3400-\u9FFF]/g,"")
.replace(/[^\x00-\x7F]/g,"")
.toUpperCase();

}


function parse(t){

let modelo=t.match(/[PUS][0-9]{4}[A-Z]{1,3}/);

let serial=t.match(/TH-[A-Z0-9-]{15,40}/);

let mac=t.match(/[A-F0-9]{12}/);

let express=t.replace(/\s/g,"").match(/[0-9]{10,12}/);

let svc=t.match(/SVC\s*TAG\s*:?\s*([A-Z0-9]{7})/);

let fecha=t.match(/DATE OF MFG.*?([A-Z]+\s*,?\s*\d{4})/);


marca.value="DELL";
modelo.value=modelo?modelo[0]:"";
svc.value=svc?svc[1]:"";
serial.value=serial?serial[0]:"";
express.value=express?express[0]:"";
mac.value=mac?mac[0]:"";
fecha.value=fecha?fecha[1]:"";

}


function guardar(){

let data={
marca:marca.value,
modelo:modelo.value,
service:svc.value,
serial:serial.value,
express:express.value,
fecha:fecha.value,
mac:mac.value
};

localStorage.setItem("dell_inventory_last",JSON.stringify(data));

estado.innerHTML="Guardado correctamente";

}

</script>

</body>
</html>
