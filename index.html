<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Monitores V10</title>

<style>
body{margin:0;background:#f4f6f8;font-family:Segoe UI,Arial;color:#222}
header{background:#7a0019;color:#fff;padding:20px}
.container{max-width:950px;margin:auto;padding:15px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 5px 15px #0002}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#7a0019;color:#fff;font-weight:bold;margin-top:10px}
video{width:100%;border-radius:12px;background:#000}
.status{padding:10px;border-radius:8px;background:#eee;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,textarea,select{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc}
.auto{background:#eef1f4}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<h1>Inventario de Monitores TI</h1>
<p>Escaneo de activos</p>
</header>

<div class="container">

<div class="card">
<h2>Cámara</h2>

<video id="video" autoplay playsinline></video>

<button onclick="abrirCamara()">Abrir cámara</button>
<button onclick="capturar()">Capturar etiqueta</button>

<div id="status" class="status">
Cámara detenida
</div>

<textarea id="resultado" placeholder="Resultado"></textarea>

</div>


<div class="card">
<h2>Datos del monitor</h2>

<div class="grid">
<input id="marca" class="auto" placeholder="Marca">
<input id="modelo" class="auto" placeholder="Modelo">
<input id="serial" class="auto" placeholder="Serial">
<input id="tag" class="auto" placeholder="Service Tag">
<input id="mac" class="auto" placeholder="MAC">
<input id="fabricacion" class="auto" placeholder="Fabricación">

<input id="usuario" placeholder="Usuario">
<input id="area" placeholder="Área">
<input id="ubicacion" placeholder="Ubicación">
</div>

</div>

</div>

<script>

let stream=null;

async function abrirCamara(){

try{

stream = await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{
ideal:"environment"
}
},
audio:false
});

document.getElementById("video").srcObject=stream;

document.getElementById("status").innerHTML=
"Cámara activa. Permiso concedido.";

}catch(error){

document.getElementById("status").innerHTML=
"Error cámara: "+error.message;

}

}


function capturar(){

if(!stream){

document.getElementById("status").innerHTML=
"Primero debe abrir la cámara.";

return;

}

document.getElementById("status").innerHTML=
"Imagen capturada. Listo para análisis.";

}

</script>

</body>
</html>
