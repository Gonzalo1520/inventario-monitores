<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dell Smart Scanner V4 Chinese Filter</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:15px}
.card{background:#1e293b;padding:18px;border-radius:16px;margin-bottom:15px}
video{width:100%;border-radius:12px;background:#000}
button{width:100%;padding:15px;margin-top:10px;background:#0076ce;color:white;border:0;border-radius:12px;font-size:17px}
.field{background:#111827;padding:10px;border-radius:8px;margin:8px 0}
.ok{color:#22c55e}
</style>
</head>

<body>

<h2>Inventario Monitores Dell</h2>

<div class="card">
<video id="video" autoplay playsinline></video>
<button onclick="openCamera()">Abrir cámara</button>
<button onclick="scan()">Capturar etiqueta Dell</button>
</div>

<div class="card">
<h3>Resultado validado</h3>
<div id="result">Esperando captura...</div>
</div>

<script>

async function openCamera(){
let stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
});
video.srcObject=stream;
}


/*
====================================================
FILTRO DELL
====================================================

Elimina:
- Chino
- Japonés
- Coreano
- Símbolos Unicode

Mantiene:
A-Z
0-9
-
:
,
espacios

*/

function cleanDellText(text){

return text
.replace(/[\u3400-\u9FFF]/g,'')
.replace(/[^\x00-\x7F]/g,'')
.replace(/\s+/g,' ')
.toUpperCase();

}


/*
Correcciones OCR comunes Dell
*/

function correctOCR(text){

return text
.replace(/O/g,"0")
.replace(/[IL]/g,"1")
.replace(/S/g,"5")
.replace(/B/g,"8");

}


/*
Validadores Dell
*/

function validateModel(text){

let match=text.match(/[PUS][0-9]{4}[A-Z]{1,3}/);
return match ? match[0] : "No detectado";

}


function validateServiceTag(text,model){

let values=text.match(/[A-Z0-9]{7}/g)||[];

let valid=values.find(x=>x!==model);

return valid || "No detectado";

}


function validateSerial(text){

let match=text.match(/TH-[A-Z0-9-]{15,30}/);

return match ? match[0] : "No detectado";

}


function validateMAC(text){

let match=text.match(/[A-F0-9]{12}/);

return match ? match[0] : "No detectado";

}


function validateExpress(text){

let match=text.replace(/\s/g,'').match(/\d{10,12}/);

return match ? match[0] : "No detectado";

}


/*
Simulación del OCR segmentado Dell

En la versión final:
cada región roja será procesada
por separado:
- Modelo
- Date
- SVC Tag
- Serial
- Express
- MAC

*/

function scan(){

let ocrRaw=`
DELL

型号:P2422HE

Date of Mfg/生产日期:
January, 2024

MAC address:7486E2FF121E

SVC Tag:
D19CTX3

S/N:
TH-01CBXN-TVH00-41P-1WSB-A06

Express Service Code:
28374351735
`;


let clean=correctOCR(cleanDellText(ocrRaw));


let modelo=validateModel(clean);

let resultado={

marca:"DELL",

modelo:modelo,

service:validateServiceTag(clean,modelo),

serial:validateSerial(clean),

express:validateExpress(clean),

fecha:"January, 2024",

mac:validateMAC(clean)

};


mostrar(resultado);

}


function mostrar(d){

result.innerHTML=`

<div class="field">Marca: ${d.marca}</div>
<div class="field">Modelo: ${d.modelo}</div>
<div class="field">Service Tag: ${d.service}</div>
<div class="field">Serial Number: ${d.serial}</div>
<div class="field">Express Code: ${d.express}</div>
<div class="field">Date Of Mfg: ${d.fecha}</div>
<div class="field">MAC Address: ${d.mac}</div>

<p class="ok">
Filtro chino aplicado + validación Dell
</p>

`;

}

</script>

</body>
</html>
